; -----------------------------------------------------------------------------
; DECLARE ARGUMENTS
; -----------------------------------------------------------------------------

[variable_args]
mass1 =
mass2 =
spin1x =
spin1y =
spin1z =
spin2x =
spin2y =
spin2z =
distance =
coa_phase =
inclination =
t_shift =
ra =
dec =
polarization =
injection_snr =


[static_args]
approximant = SEOBNRv5PHM
domain = time
f_lower = 20
distance = 100
waveform_length = 128
noise_interval_width = 16
original_sampling_rate = 4096
target_sampling_rate = 4096
whitening_segment_duration = 4
whitening_max_filter_duration = 4
bandpass_lower = 20
bandpass_upper = 2048
seconds_before_event = 0.80
seconds_after_event = 0.20
tukey_alpha = 0.25


; Optional: sample a single deviation value per injected template and apply
; it to modes selected at runtime (see README command example).
; domega_range = -0.20, 0.20
; dtau_range = -0.10, 0.10


; -----------------------------------------------------------------------------
; DEFINE DISTRIBUTIONS FOR PARAMETERS
; -----------------------------------------------------------------------------

; Sample intrinsic parameters directly from a posterior HDF file.
; Update `filename` and `dataset` to match your local posterior file format.
[prior-mass1+mass2+spin1x+spin1y+spin1z+spin2x+spin2y+spin2z+distance+inclination]
name = fromfile
filename = GW230814_NRSur_PE.hdf5
dataset = C00:NRSur7dq4/posterior_samples

[prior-t_shift]
name = uniform
min-t_shift = -0.1
max-t_shift = 0.1

[prior-injection_snr]
name = uniform
min-injection_snr = 12.0
max-injection_snr = 12.5

[prior-coa_phase]
name = uniform_angle

[prior-ra]
name = uniform
min-ra = 0
max-ra = 1

[prior-dec]
name = uniform
min-dec = 0
max-dec = 1

[prior-polarization]
name = uniform_angle

[constraint-1]
name = custom
constraint_arg = mass2 <= mass1
